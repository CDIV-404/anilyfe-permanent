name: Figma source export

on:
  workflow_dispatch:
  repository_dispatch:
    types: [figma-export-complete]

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.action == 'figma-export-complete'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Export selected Figma nodes
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_FILE_KEY: ${{ secrets.FIGMA_FILE_KEY }}
          FIGMA_NODE_IDS: ${{ secrets.FIGMA_NODE_IDS }}
        run: node scripts/figma-export.mjs
      - name: Commit versioned design source
        run: |
          git config user.name "anilyfe-figma-bot"
          git config user.email "anilyfe-figma-bot@users.noreply.github.com"
          git add figma-exports
          git diff --cached --quiet || git commit -m "chore: sync Figma exports"
          git push
